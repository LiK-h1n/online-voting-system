spring.application.name=online-voting-system
spring.config.import=optional:file:./secrets.properties

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_voting_system}
spring.datasource.username=${DB_USERNAME:voting_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

vote.encryption.key=${VOTE_ENCRYPTION_KEY}

resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Online Voting System <onboarding@resend.dev>}
otp.email.enabled=${OTP_EMAIL_ENABLED:false}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.admin.email=${ADMIN_EMAIL:admin@manit.ac.in}
app.admin.password=${ADMIN_PASSWORD:}
